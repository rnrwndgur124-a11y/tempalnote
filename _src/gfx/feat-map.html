<script>const R=[["바이란", 185, 118, "#6d8fb8"], ["노튼", 330, 92, "#cfe4ff"], ["킨바이", 520, 118, "#7fa3c9"], ["윈스톤", 392, 176, "#9fd3a8"], ["라인하르트", 262, 203, "#b7c98f"], ["알테스", 255, 292, "#c9b98f"], ["엑카루", 532, 240, "#d1a56b"], ["벨두인", 392, 276, "#c9a66b"], ["레이단", 505, 318, "#d08f5f"], ["코크로 섬", 448, 384, "#6fb3b8"], ["수아즈 협곡", 706, 292, "#c98f6b"], ["크라임 숲", 626, 382, "#7fbf7f"], ["레베카", 742, 372, "#d6c27a"], ["지브라", 826, 462, "#e0b86b"]];const S=document.getElementById('s');const pts=R.map(r=>[r[1],r[2]]);const hull=(P)=>{P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}for(const p of P.reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}return lo.slice(0,-1).concat(up.slice(0,-1))};const cx=pts.reduce((a,p)=>a+p[0],0)/pts.length,cy=pts.reduce((a,p)=>a+p[1],0)/pts.length;const H=hull(pts).map(p=>{const dx=p[0]-cx,dy=p[1]-cy,d=Math.hypot(dx,dy)||1;return [p[0]+dx/d*78,p[1]+dy/d*70]});const smooth=P=>{let d='';const n=P.length;for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];if(i===0)d+='M'+p1[0]+','+p1[1];const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];d+='C'+c1+' '+c2+' '+p2}return d+'Z'};
