<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:800px;height:500px;overflow:hidden;background:radial-gradient(600px 320px at 50% 40%,#18284a 0%,#070d1b 70%);font-family:'Noto Sans CJK KR',sans-serif;position:relative}
.row{position:absolute;left:0;right:0;top:36px;display:flex;justify-content:center;gap:26px}
.pf{width:320px;height:210px;border-radius:26px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 18px 40px #0009,inset 0 1px 0 #ffffff33}
.yt{background:linear-gradient(150deg,#ff4b4b 0%,#d6201f 55%,#8e0f12 100%)}
.sp{background:linear-gradient(150deg,#4f8cff 0%,#1f55e0 55%,#102c86 100%)}
.pf b{font-size:64px;font-weight:900;color:#fff;letter-spacing:-1px;text-shadow:0 3px 12px #0005}
.pf small{font-size:20px;font-weight:800;color:#ffffffd0;margin-top:6px;letter-spacing:2px}
.live{position:absolute;left:18px;top:16px;display:flex;align-items:center;gap:7px;background:#000000aa;color:#fff;font-weight:900;font-size:16px;padding:5px 12px;border-radius:99px}
.live i{width:10px;height:10px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 0 3px #ff3b3b55}
.sv{position:absolute;left:0;right:0;bottom:200px;display:flex;justify-content:center;gap:10px}
.sv span{font-size:18px;font-weight:800;color:#e3c27a;border:1.5px solid #c9a24a99;border-radius:99px;padding:5px 16px;background:#0a1426cc}
</style></head><body>
<div class="row"><div class="pf yt"><span class="live"><i></i>LIVE</span><b>YouTube</b><small>유튜브</small></div><div class="pf sp"><span class="live"><i></i>LIVE</span><b>SOOP</b><small>숲</small></div></div>
<div class="sv"><span>라우엘</span><span>레가스</span><span>루나</span><span>하스터</span><span>루비</span></div>
</body></html>
