<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:800px;height:500px;overflow:hidden;background:radial-gradient(520px 300px at 50% 42%,#1d2e52 0%,#0a1324 62%,#050a14 100%);font-family:'Noto Serif CJK KR',serif;position:relative}
.orn{position:absolute;inset:26px;border:1.5px solid #c9a24a66;border-radius:6px}
.orn:before{content:'';position:absolute;inset:8px;border:1px solid #c9a24a33;border-radius:3px}
.c{position:absolute;width:26px;height:26px;border:2px solid #e3c27a}
.tl{left:20px;top:20px;border-right:0;border-bottom:0}.tr{right:20px;top:20px;border-left:0;border-bottom:0}.bl{left:20px;bottom:20px;border-right:0;border-top:0}.br{right:20px;bottom:20px;border-left:0;border-top:0}
.box{position:absolute;left:0;right:0;top:0;bottom:70px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.en{font:700 18px/1 'Noto Serif CJK KR';letter-spacing:12px;color:#c9a24a;margin-bottom:14px;padding-left:12px}
h1{font-size:118px;font-weight:900;letter-spacing:6px;background:linear-gradient(180deg,#fff6d8 0%,#f0d58f 38%,#c99a4e 70%,#8f6420 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px #e3c27a55)}
.line{display:flex;align-items:center;gap:14px;margin-top:16px;color:#e3c27a}
.line i{width:120px;height:1.5px;background:linear-gradient(90deg,transparent,#e3c27a)}.line i:last-child{transform:scaleX(-1)}
.line b{width:10px;height:10px;transform:rotate(45deg);background:#e3c27a;display:block}
.bub{position:absolute;border:2px solid #e3c27a2e;border-radius:18px;width:120px;height:70px}
.bub:after{content:'';position:absolute;bottom:-12px;left:22px;border:10px solid transparent;border-top-color:#e3c27a2e}
</style></head><body>
<div class="bub" style="left:70px;top:70px;transform:rotate(-8deg)"></div><div class="bub" style="right:80px;top:300px;transform:rotate(7deg) scaleX(-1)"></div>
<div class="orn"></div><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
<div class="box"><div class="en">COMMUNITY</div><h1>커뮤니티</h1><div class="line"><i></i><b></b><i></i></div></div>
</body></html>
